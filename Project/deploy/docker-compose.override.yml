version: '3.8'

# Override file for development environment
# Use with: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  petrol-station-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    volumes:
      - ..:/app
      - /app/__pycache__
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_GLOBAL_DEVELOPMENT_MODE=true
    command: ["streamlit", "run", "main_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.runOnSave", "true"]

  petrol-station-db:
    ports:
      - "3306:3306"

  petrol-station-nginx:
    ports:
      - "80:80"
      - "443:443"
