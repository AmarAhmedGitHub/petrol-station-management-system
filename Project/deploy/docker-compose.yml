version: '3.8'

services:
  # Streamlit Application
  petrol-station-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: petrol-station-app
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - petrol-station-db
    networks:
      - petrol-station-network

  # MySQL Database
  petrol-station-db:
    image: mysql:8.0
    container_name: petrol-station-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-Petrolpump_Management_Enhanced}
      MYSQL_USER: ${DB_USER:-petrol_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-petrol_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - petrol-station-network
    command: --default-authentication-plugin=mysql_native_password

  # Nginx Reverse Proxy
  petrol-station-nginx:
    image: nginx:alpine
    container_name: petrol-station-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs
      - ./nginx-logs:/var/log/nginx
    depends_on:
      - petrol-station-app
    networks:
      - petrol-station-network

  # Backup Service
  petrol-station-backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    container_name: petrol-station-backup
    restart: "no"
    environment:
      - BACKUP_SCHEDULE=daily
      - BACKUP_RETENTION_DAYS=30
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
    depends_on:
      - petrol-station-db
    networks:
      - petrol-station-network
    command: ["cron", "-f"]

volumes:
  mysql_data:
    driver: local

networks:
  petrol-station-network:
    driver: bridge
